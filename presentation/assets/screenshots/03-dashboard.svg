<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Dashboard analisi">
  <defs>
    <radialGradient id="bgRose" cx="0" cy="0" r="1" gradientTransform="translate(100 100) scale(500)">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgLav" cx="0" cy="0" r="1" gradientTransform="translate(1180 640) scale(560)">
      <stop offset="0" stop-color="#A100FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hilite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a0022" flood-opacity="0.08"/>
    </filter>
    <style>
      .body{font-family:Inter,system-ui,sans-serif;fill:#0a0022}
      .brand{font-family:Fraunces,'Times New Roman',serif;fill:#0a0022}
      .muted{fill:#6b6785}
      .lbl{font-family:Inter,sans-serif;font-size:12px;fill:#6b6785}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="720" fill="url(#bgRose)"/>
  <rect width="1280" height="720" fill="url(#bgLav)"/>

  <!-- nav -->
  <circle cx="48" cy="40" r="10" fill="url(#hilite)"/>
  <text x="66" y="46" class="brand" font-size="17" font-weight="600">Budget Storyteller</text>
  <text x="1050" y="46" class="body" font-size="13" fill="#6b6785">IT / EN</text>
  <circle cx="1200" cy="40" r="15" fill="#A100FF"/>
  <text x="1200" y="45" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#fff" font-weight="600">GD</text>

  <!-- title -->
  <text x="60" y="105" class="brand" font-size="38" font-weight="600">La tua analisi</text>
  <text x="60" y="130" class="body" font-size="13" fill="#6b6785">Settembre 2026 · 218 transazioni · 3 conti</text>

  <!-- SCORE CARD -->
  <g transform="translate(60 156)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="380" height="270" rx="18" fill="#fff" stroke="#e9e4f3"/>
    <text x="24" y="30" class="body" font-size="13" fill="#6b6785" font-weight="600">SCORE FINANZIARIO</text>
    <!-- ring -->
    <circle cx="110" cy="132" r="58" fill="none" stroke="#EDE1FF" stroke-width="14"/>
    <circle cx="110" cy="132" r="58" fill="none" stroke="url(#hilite)" stroke-width="14"
            stroke-dasharray="262 364" stroke-linecap="round" transform="rotate(-90 110 132)"/>
    <text x="110" y="130" text-anchor="middle" class="brand" font-size="36" font-weight="600">72</text>
    <text x="110" y="152" text-anchor="middle" class="body" font-size="11" fill="#6b6785">/ 100</text>

    <!-- breakdown bars -->
    <g transform="translate(200 90)">
      <text x="0" y="0" class="lbl">Risparmio</text>
      <rect x="0" y="8" width="150" height="6" rx="3" fill="#EDE1FF"/>
      <rect x="0" y="8" width="105" height="6" rx="3" fill="url(#hilite)"/>
      <text x="0" y="34" class="lbl">Stabilità entrate</text>
      <rect x="0" y="42" width="150" height="6" rx="3" fill="#EDE1FF"/>
      <rect x="0" y="42" width="128" height="6" rx="3" fill="url(#hilite)"/>
      <text x="0" y="68" class="lbl">Diversificazione</text>
      <rect x="0" y="76" width="150" height="6" rx="3" fill="#EDE1FF"/>
      <rect x="0" y="76" width="78" height="6" rx="3" fill="url(#hilite)"/>
      <text x="0" y="102" class="lbl">Buffer emergenza</text>
      <rect x="0" y="110" width="150" height="6" rx="3" fill="#EDE1FF"/>
      <rect x="0" y="110" width="55" height="6" rx="3" fill="#F472B6"/>
    </g>
    <text x="24" y="248" class="body" font-size="12" fill="#6b6785">Sei sopra la media del tuo profilo (65).</text>
  </g>

  <!-- PIE -->
  <g transform="translate(460 156)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="380" height="270" rx="18" fill="#fff" stroke="#e9e4f3"/>
    <text x="24" y="30" class="body" font-size="13" fill="#6b6785" font-weight="600">DOVE VANNO I TUOI SOLDI</text>
    <g transform="translate(120 150)">
      <!-- 6 slices, cumulative fractions: .28 .20 .16 .14 .12 .10 -->
      <path d="M0 0 L60 0 A60 60 0 0 1 -10.4 59.1 Z" fill="#A100FF"/>
      <path d="M0 0 L-10.4 59.1 A60 60 0 0 1 -58.9 -11.5 Z" fill="#F472B6"/>
      <path d="M0 0 L-58.9 -11.5 A60 60 0 0 1 -18.5 -57.1 Z" fill="#34D399"/>
      <path d="M0 0 L-18.5 -57.1 A60 60 0 0 1 30.0 -51.9 Z" fill="#FBBF24"/>
      <path d="M0 0 L30.0 -51.9 A60 60 0 0 1 55.6 -22.7 Z" fill="#60A5FA"/>
      <path d="M0 0 L55.6 -22.7 A60 60 0 0 1 60 0 Z" fill="#8B5CF6"/>
      <circle r="30" fill="#fff"/>
      <text y="5" text-anchor="middle" class="body" font-size="13" font-weight="600">2.940 EUR</text>
    </g>
    <g transform="translate(220 90)">
      <g><rect x="0" y="0" width="10" height="10" rx="2" fill="#A100FF"/><text x="18" y="9" class="lbl">Casa 28%</text></g>
      <g transform="translate(0 22)"><rect width="10" height="10" rx="2" fill="#F472B6"/><text x="18" y="9" class="lbl">Cibo 20%</text></g>
      <g transform="translate(0 44)"><rect width="10" height="10" rx="2" fill="#34D399"/><text x="18" y="9" class="lbl">Trasporti 16%</text></g>
      <g transform="translate(0 66)"><rect width="10" height="10" rx="2" fill="#FBBF24"/><text x="18" y="9" class="lbl">Loisir 14%</text></g>
      <g transform="translate(0 88)"><rect width="10" height="10" rx="2" fill="#60A5FA"/><text x="18" y="9" class="lbl">Bollette 12%</text></g>
      <g transform="translate(0 110)"><rect width="10" height="10" rx="2" fill="#8B5CF6"/><text x="18" y="9" class="lbl">Altro 10%</text></g>
    </g>
  </g>

  <!-- RADAR fingerprint -->
  <g transform="translate(860 156)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="360" height="270" rx="18" fill="#fff" stroke="#e9e4f3"/>
    <text x="24" y="30" class="body" font-size="13" fill="#6b6785" font-weight="600">IMPRONTA SETTIMANALE</text>
    <g transform="translate(180 150)">
      <!-- rings -->
      <circle r="30" fill="none" stroke="#EDE1FF"/>
      <circle r="60" fill="none" stroke="#EDE1FF"/>
      <circle r="90" fill="none" stroke="#EDE1FF"/>
      <!-- axes for 7 days -->
      <g stroke="#EDE1FF">
        <line x1="0" y1="0" x2="0" y2="-90"/>
        <line x1="0" y1="0" x2="70.3" y2="-56.2"/>
        <line x1="0" y1="0" x2="87.8" y2="19.9"/>
        <line x1="0" y1="0" x2="39.0" y2="81.1"/>
        <line x1="0" y1="0" x2="-39.0" y2="81.1"/>
        <line x1="0" y1="0" x2="-87.8" y2="19.9"/>
        <line x1="0" y1="0" x2="-70.3" y2="-56.2"/>
      </g>
      <!-- polygon of expenses -->
      <polygon points="0,-45 55,-44 70,15 32,68 -30,55 -66,15 -50,-40"
               fill="url(#hilite)" fill-opacity="0.35" stroke="#A100FF" stroke-width="2"/>
      <!-- labels -->
      <text x="0" y="-100" text-anchor="middle" class="lbl">L</text>
      <text x="80" y="-60" class="lbl">M</text>
      <text x="100" y="24" class="lbl">M</text>
      <text x="44" y="94" class="lbl">G</text>
      <text x="-52" y="94" class="lbl">V</text>
      <text x="-108" y="24" class="lbl">S</text>
      <text x="-88" y="-60" class="lbl">D</text>
    </g>
  </g>

  <!-- story card -->
  <g transform="translate(60 448)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="1160" height="150" rx="18" fill="#fff" stroke="#e9e4f3"/>
    <text x="30" y="34" class="brand" font-size="20" font-weight="600">La tua storia</text>
    <text x="30" y="66" class="body" font-size="14" fill="#0a0022">
      A settembre hai speso 2.940 EUR (-8% vs agosto). Le uscite si concentrano il giovedì sera —
    </text>
    <text x="30" y="86" class="body" font-size="14" fill="#0a0022">
      cene fuori e delivery pesano 380 EUR. Il tuo buffer d'emergenza copre 1,4 mesi: l'obiettivo consigliato è 3.
    </text>
    <text x="30" y="106" class="body" font-size="14" fill="#0a0022">
      Se sposti 120 EUR/mese da "Loisir" a un conto separato, arrivi a 3 mesi entro maggio 2027.
    </text>
    <g transform="translate(30 118)">
      <rect x="0" y="0" width="128" height="26" rx="13" fill="url(#hilite)"/>
      <text x="64" y="18" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#fff" font-weight="600">Vedi scenario</text>
    </g>
  </g>

  <!-- scenarios + lessons row -->
  <g transform="translate(60 620)">
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="380" height="72" rx="14" fill="#fff" stroke="#e9e4f3"/>
      <text x="20" y="26" class="body" font-size="12" fill="#6b6785" font-weight="600">SCENARIO</text>
      <text x="20" y="50" class="body" font-size="14" font-weight="600">E se risparmi 120 EUR/mese?</text>
      <text x="20" y="66" class="body" font-size="11" fill="#6b6785">buffer 3 mesi entro mag 2027</text>
    </g>
    <g transform="translate(400 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="380" height="72" rx="14" fill="#fff" stroke="#e9e4f3"/>
      <text x="20" y="26" class="body" font-size="12" fill="#6b6785" font-weight="600">MINI LEZIONE</text>
      <text x="20" y="50" class="body" font-size="14" font-weight="600">Costruire un fondo di emergenza</text>
      <text x="20" y="66" class="body" font-size="11" fill="#6b6785">beginner · 8 min</text>
    </g>
    <g transform="translate(800 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="360" height="72" rx="14" fill="#fff" stroke="#e9e4f3"/>
      <text x="20" y="26" class="body" font-size="12" fill="#6b6785" font-weight="600">MINI LEZIONE</text>
      <text x="20" y="50" class="body" font-size="14" font-weight="600">Cos'e il TAEG (e perché conta)</text>
      <text x="20" y="66" class="body" font-size="11" fill="#6b6785">intermediate · 6 min</text>
    </g>
  </g>
</svg>
