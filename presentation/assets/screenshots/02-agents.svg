<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Agenti al lavoro">
  <defs>
    <radialGradient id="bgRose" cx="0" cy="0" r="1" gradientTransform="translate(120 120) scale(520)">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgLav" cx="0" cy="0" r="1" gradientTransform="translate(1160 620) scale(520)">
      <stop offset="0" stop-color="#A100FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hilite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDE1FF"/>
      <stop offset="1" stop-color="#FCE7F3"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a0022" flood-opacity="0.08"/>
    </filter>
    <style>
      .body{font-family:Inter,system-ui,sans-serif;fill:#0a0022}
      .brand{font-family:Fraunces,'Times New Roman',serif;fill:#0a0022}
      .lbl{font-family:Inter,sans-serif;font-size:13px;fill:#0a0022}
      .muted{fill:#6b6785}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="720" fill="url(#bgRose)"/>
  <rect width="1280" height="720" fill="url(#bgLav)"/>

  <!-- nav -->
  <circle cx="64" cy="52" r="12" fill="url(#hilite)"/>
  <text x="86" y="58" class="brand" font-size="20" font-weight="600">Budget Storyteller</text>
  <text x="1050" y="58" class="body" font-size="14" fill="#6b6785">IT / EN</text>
  <circle cx="1200" cy="52" r="18" fill="#A100FF"/>
  <text x="1200" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#fff" font-weight="600">GD</text>

  <!-- hero compact -->
  <text x="640" y="128" text-anchor="middle" class="brand" font-size="32" font-weight="600">La tua storia sta prendendo forma</text>

  <!-- chat compact -->
  <g filter="url(#cardShadow)">
    <rect x="220" y="156" width="840" height="64" rx="32" fill="#ffffff" stroke="#e9e4f3"/>
    <text x="264" y="195" class="body" font-size="15" fill="#8a86a1">Analizza estratto_conto_settembre.pdf</text>
    <circle cx="1004" cy="188" r="22" fill="url(#hilite)"/>
    <path d="M996 188 L1012 188 M1006 182 L1012 188 L1006 194" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- agents ribbon -->
  <g transform="translate(160 250)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="960" height="128" rx="20" fill="url(#ribbon)"/>
    <text x="30" y="34" class="body" font-size="14" fill="#5b3a91" font-weight="600">ANALISI IN CORSO…</text>
    <text x="30" y="56" class="body" font-size="13" fill="#6b6785">4 agenti stanno collaborando alla tua storia finanziaria</text>

    <!-- dots -->
    <g transform="translate(30 82)">
      <!-- Parser done -->
      <g>
        <circle cx="14" cy="14" r="14" fill="#34D399"/>
        <path d="M8 14 L12 18 L20 10" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="19" class="lbl" font-weight="600">Parser</text>
        <text x="34" y="34" class="lbl" fill="#6b6785" font-size="11">estratto letto</text>
      </g>
      <!-- Analyzer active -->
      <g transform="translate(240 0)">
        <circle cx="14" cy="14" r="16" fill="none" stroke="#A100FF" stroke-width="2" opacity="0.4"/>
        <circle cx="14" cy="14" r="14" fill="#A100FF"/>
        <circle cx="14" cy="14" r="6" fill="#fff" opacity="0.9"/>
        <text x="38" y="19" class="lbl" font-weight="600">Analyzer</text>
        <text x="38" y="34" class="lbl" fill="#6b6785" font-size="11">clustering categorie…</text>
      </g>
      <!-- Simulator pending -->
      <g transform="translate(500 0)">
        <circle cx="14" cy="14" r="14" fill="#e5e1ee"/>
        <text x="34" y="19" class="lbl" font-weight="600" fill="#6b6785">Simulator</text>
        <text x="34" y="34" class="lbl" fill="#a19cb6" font-size="11">in coda</text>
      </g>
      <!-- Advisor pending -->
      <g transform="translate(740 0)">
        <circle cx="14" cy="14" r="14" fill="#e5e1ee"/>
        <text x="34" y="19" class="lbl" font-weight="600" fill="#6b6785">Advisor</text>
        <text x="34" y="34" class="lbl" fill="#a19cb6" font-size="11">in coda</text>
      </g>
    </g>
  </g>

  <!-- dashboard preview (emerging, low opacity) -->
  <g transform="translate(140 410)" opacity="0.4">
    <text x="0" y="0" class="brand" font-size="24" font-weight="600">La tua analisi</text>

    <g transform="translate(0 26)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="320" height="220" rx="18" fill="#fff" stroke="#e9e4f3"/>
      <text x="24" y="34" class="body" font-size="14" font-weight="600">Score finanziario</text>
      <circle cx="160" cy="120" r="52" fill="none" stroke="#EDE1FF" stroke-width="12"/>
      <circle cx="160" cy="120" r="52" fill="none" stroke="url(#hilite)" stroke-width="12" stroke-dasharray="235 326" stroke-dashoffset="0" transform="rotate(-90 160 120)" stroke-linecap="round"/>
      <text x="160" y="128" text-anchor="middle" class="brand" font-size="30" font-weight="600">72</text>
    </g>

    <g transform="translate(340 26)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="320" height="220" rx="18" fill="#fff" stroke="#e9e4f3"/>
      <text x="24" y="34" class="body" font-size="14" font-weight="600">Ripartizione spese</text>
      <circle cx="160" cy="128" r="60" fill="#e9e4f3"/>
      <path d="M160 68 A60 60 0 0 1 213 156 L160 128 Z" fill="#A100FF"/>
      <path d="M213 156 A60 60 0 0 1 130 182 L160 128 Z" fill="#F472B6"/>
      <path d="M130 182 A60 60 0 0 1 100 130 L160 128 Z" fill="#34D399"/>
    </g>

    <g transform="translate(680 26)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="320" height="220" rx="18" fill="#fff" stroke="#e9e4f3"/>
      <text x="24" y="34" class="body" font-size="14" font-weight="600">Impronta settimanale</text>
      <polygon points="160,80 210,110 200,170 120,170 110,110" fill="none" stroke="#A100FF" stroke-width="2" opacity="0.6"/>
      <polygon points="160,95 195,115 185,158 135,158 125,115" fill="url(#hilite)" opacity="0.35"/>
    </g>
  </g>
</svg>
