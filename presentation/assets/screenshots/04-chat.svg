<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Chat Q&amp;A">
  <defs>
    <radialGradient id="bgRose" cx="0" cy="0" r="1" gradientTransform="translate(120 120) scale(520)">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgLav" cx="0" cy="0" r="1" gradientTransform="translate(1180 620) scale(540)">
      <stop offset="0" stop-color="#A100FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hilite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="userBub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#7A00CC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a0022" flood-opacity="0.08"/>
    </filter>
    <style>
      .body{font-family:Inter,system-ui,sans-serif;fill:#0a0022}
      .brand{font-family:Fraunces,'Times New Roman',serif;fill:#0a0022}
      .muted{fill:#6b6785}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="720" fill="url(#bgRose)"/>
  <rect width="1280" height="720" fill="url(#bgLav)"/>

  <!-- nav -->
  <circle cx="48" cy="40" r="10" fill="url(#hilite)"/>
  <text x="66" y="46" class="brand" font-size="17" font-weight="600">Budget Storyteller</text>
  <text x="1050" y="46" class="body" font-size="13" fill="#6b6785">IT / EN</text>
  <circle cx="1200" cy="40" r="15" fill="#A100FF"/>
  <text x="1200" y="45" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#fff" font-weight="600">GD</text>

  <!-- page title -->
  <text x="60" y="100" class="brand" font-size="28" font-weight="600">Chiedi al tuo advisor</text>
  <text x="60" y="122" class="body" font-size="13" fill="#6b6785">Risponde con esempi concreti e link alle mini-lezioni.</text>

  <!-- conversation area -->
  <g transform="translate(140 150)">
    <!-- user turn 1 (right) -->
    <g transform="translate(560 0)">
      <rect x="0" y="0" width="440" height="52" rx="18" fill="url(#userBub)"/>
      <text x="24" y="32" class="body" font-size="15" fill="#fff">Cosa significa TAEG?</text>
    </g>

    <!-- bot turn 1 (left) -->
    <g transform="translate(0 72)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="720" height="170" rx="18" fill="#ffffff" stroke="#e9e4f3"/>
      <circle cx="26" cy="26" r="12" fill="url(#hilite)"/>
      <text x="48" y="30" class="body" font-size="12" fill="#6b6785" font-weight="600">ADVISOR</text>
      <text x="24" y="60" class="body" font-size="14">Il TAEG è il Tasso Annuale Effettivo Globale. Include gli interessi</text>
      <text x="24" y="80" class="body" font-size="14">e tutte le spese del prestito (istruttoria, assicurazioni, incasso rata).</text>
      <text x="24" y="100" class="body" font-size="14">È il vero costo che paghi ogni anno — usalo per confrontare due offerte,</text>
      <text x="24" y="120" class="body" font-size="14">non farti confondere solo dal TAN.</text>
      <g transform="translate(24 138)">
        <rect x="0" y="0" width="290" height="26" rx="13" fill="#F5EEFF" stroke="#D9C2FF"/>
        <text x="14" y="18" font-family="Inter,sans-serif" font-size="12" fill="#5b3a91" font-weight="600">→ Approfondisci con la lezione</text>
      </g>
    </g>

    <!-- user turn 2 -->
    <g transform="translate(500 262)">
      <rect x="0" y="0" width="500" height="52" rx="18" fill="url(#userBub)"/>
      <text x="24" y="32" class="body" font-size="15" fill="#fff">E come lo confronto con il TAN?</text>
    </g>

    <!-- bot turn 2 -->
    <g transform="translate(0 334)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="720" height="150" rx="18" fill="#ffffff" stroke="#e9e4f3"/>
      <circle cx="26" cy="26" r="12" fill="url(#hilite)"/>
      <text x="48" y="30" class="body" font-size="12" fill="#6b6785" font-weight="600">ADVISOR</text>
      <text x="24" y="60" class="body" font-size="14">Il TAN è solo il tasso "puro" degli interessi. Il TAEG aggiunge le spese</text>
      <text x="24" y="80" class="body" font-size="14">accessorie e ti dà il costo reale. Esempio: TAN 6% ma TAEG 7,4% =</text>
      <text x="24" y="100" class="body" font-size="14">1,4 punti di spese nascoste. A parità di rata, scegli il TAEG più basso.</text>
      <g transform="translate(24 118)">
        <rect x="0" y="0" width="220" height="24" rx="12" fill="#FCE7F3" stroke="#F9A8D4"/>
        <text x="14" y="17" font-family="Inter,sans-serif" font-size="11" fill="#9d174d" font-weight="600">Esempio numerico completo</text>
      </g>
    </g>
  </g>

  <!-- input bar bottom -->
  <g transform="translate(140 620)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="1000" height="60" rx="30" fill="#ffffff" stroke="#e9e4f3"/>
    <text x="30" y="38" class="body" font-size="15" fill="#8a86a1">Scrivi la tua domanda…</text>
    <circle cx="960" cy="30" r="22" fill="url(#hilite)"/>
    <path d="M952 30 L968 30 M962 24 L968 30 L962 36" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
